name: Vanguard Research

# Thin caller of the reusable workflow (research.yml), which holds the steps.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue: { description: "issue number", required: true }

permissions:
  contents: read
  issues: write

concurrency:
  group: vanguard-research-${{ github.repository }}
  cancel-in-progress: false

jobs:
  research:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'needs research' &&
       contains(fromJSON('["SebaBoler","pawelkrystkiewicz"]'), github.event.issue.user.login) &&
       contains(fromJSON('["SebaBoler","pawelkrystkiewicz"]'), github.event.sender.login))
    uses: ./.github/workflows/research.yml
    with:
      allowed-actors: '["SebaBoler","pawelkrystkiewicz"]'
      number: ${{ github.event.issue.number || inputs.issue }}
      provider: claude
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
