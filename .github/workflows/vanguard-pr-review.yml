name: Vanguard PR Review

# Thin caller of the reusable workflow (pr-review.yml), which holds the steps.

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: vanguard-pr-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ready for vanguard review' &&
      github.event.pull_request.draft == false &&
      contains(fromJSON('["SebaBoler","pawelkrystkiewicz"]'), github.event.pull_request.user.login) &&
      contains(fromJSON('["SebaBoler","pawelkrystkiewicz"]'), github.event.sender.login))
    uses: ./.github/workflows/pr-review.yml
    with:
      allowed-actors: '["SebaBoler","pawelkrystkiewicz"]'
      llm-proxy: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
