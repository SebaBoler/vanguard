version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # apps/desktop is its own pnpm project with its own lockfile (see ci.yml); without this entry its
  # advisories surface as alerts but never as PRs.
  - package-ecosystem: 'npm'
    directory: '/apps/desktop'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:15'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      desktop-dependencies:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:30'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
